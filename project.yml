name: Lyra
options:
  bundleIdPrefix: dev.ambient.lyra
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Lyra:
    type: application
    platform: macOS
    sources:
      - path: Lyra
        excludes:
          - Tests/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ambient.lyra
        PRODUCT_NAME: Lyra
        INFOPLIST_FILE: Lyra/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Lyra/Resources/Lyra.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: Lyra/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lyra
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2026 Ambient."
        NSPrincipalClass: NSApplication
    entitlements:
      path: Lyra/Resources/Lyra.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true

  LyraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Lyra/Tests
    dependencies:
      - target: Lyra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ambient.lyra.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lyra:
    build:
      targets:
        Lyra: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LyraTests
